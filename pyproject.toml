[project]
name = "gbharness"
version = "0.1.0"
description = "Input layer for an agentic Game Boy Advance harness"
readme = "README.md"
requires-python = ">=3.13"
# The emulator is the mGBA libretro core, loaded at runtime via ctypes. It is a
# system package (`apt install libretro-mgba`), not a Python dependency.
#
# Each layer's dependencies are an extra, so the dependency graph mirrors the
# architecture: the input layer stays importable with nothing but the standard library.
dependencies = ["python-dotenv>=1.2"]

[project.optional-dependencies]
vision = [
    "pillow>=12",
    "numpy>=2.5",
    "pygame-ce>=2.5",
]
agent = [
    "google-genai>=1.0",
    "neatlogs[vertex-ai]>=0.1",
    # Keep the OpenAI adapter available while Vertex AI becomes the default provider.
    "openai>=3.28",
]

[dependency-groups]
dev = [
    "gbharness[vision,agent]",
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gbharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
packages = ["gbharness"]
strict = true

[tool.ruff.lint.per-file-ignores]
# `FRAME_MS == pytest.approx(...)` is the idiomatic pytest form; ruff reads approx() as a
# constant and wants it on the left.
"tests/*" = ["SIM300"]



[[tool.mypy.overrides]]
# ctypes' CFUNCTYPE builds callback types at runtime, so mypy sees the resulting
# decorators as untyped. The callbacks themselves are annotated; only the factory is
# opaque.
module = "gbharness.backends.libretro_port"
disable_error_code = ["untyped-decorator"]
